<style>
/* Layout: barra de control fija arriba + láminas 16:9 apiladas como en el PPT, cada una con banda roja de título y pie corporativo */
:root{
  color-scheme: light;
  --bg:#E9ECF1; --paper:#FFFFFF; --ink:#16202E; --ink-2:#4A5568; --muted:#7A8596; --line:#DCE1E8; --soft:#F4F6F9;
  --brand:#DA291C; --brand-dk:#B31F14; --navy:#1F3B63;
  --s1:#2a78d6; --s2:#4a3aa7; --s3:#1baf7a; --s4:#eda100;
  --ok:#1E7D3A; --good:#4D8F2A; --warn:#B7791F; --crit:#C62828; --track:#E6EAF0;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow","Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:0 40px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
.num,td,th{font-variant-numeric:tabular-nums}

/* ---- barra de control ---- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:-16px;padding:10px 16px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.02em;color:var(--brand)}
.brand small{font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.chip .c{font-weight:500;opacity:.75;margin-left:4px}
select,input[type=number]{border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--paper)}
input[type=number]{width:64px}
.btn{border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:6px;padding:5px 12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:disabled{opacity:.6;cursor:progress}
.btn.ghost{background:var(--paper);color:var(--navy)}
.src{font-size:12px;color:var(--muted);flex:1 1 220px;min-width:0}
details.cfg{position:relative}
details.cfg summary{list-style:none;cursor:pointer}
details.cfg summary::-webkit-details-marker{display:none}
.cfgp{position:absolute;right:0;top:calc(100% + 8px);background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(22,32,46,.15);padding:14px;width:min(340px,86vw);display:grid;gap:10px;z-index:30}
.cfgp label{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}
.cfgp p{margin:0;font-size:12px;color:var(--muted)}
.nav{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;margin:0 auto;max-width:1280px;scrollbar-width:thin}
.nav a{flex:0 0 auto;font-size:12px;text-decoration:none;color:var(--ink-2);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:4px 9px;white-space:nowrap}
.nav a b{color:var(--brand);margin-right:4px}

/* ---- láminas: lienzo fijo 1280×720 escalado ---- */
.deck{display:grid;gap:22px;max-width:1280px;margin:14px auto 0}
.stage{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;overflow:hidden;background:var(--paper);box-shadow:0 1px 2px rgba(22,32,46,.08),0 8px 24px rgba(22,32,46,.06);scroll-margin-top:120px}
.slide{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:var(--paper);display:flex;flex-direction:column;overflow:hidden;font-size:13px}
.xp{position:absolute;right:10px;bottom:10px;z-index:2;width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--navy);display:grid;place-items:center;cursor:pointer;opacity:.85}
.xp:hover{opacity:1;border-color:var(--navy)}
.sh{display:flex;align-items:stretch;justify-content:space-between;gap:12px;padding-right:22px;height:60px;flex:0 0 auto;margin-top:8px}
.sh h2{margin:0;background:var(--brand);color:#fff;font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.1;letter-spacing:.01em;padding:0 34px 0 24px;display:flex;align-items:center;clip-path:polygon(0 0,100% 0,calc(100% - 18px) 100%,0 100%);max-width:1010px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh h2.long{font-size:22px}
.sh .tag{align-self:center;display:flex;gap:12px;align-items:center}
.logo{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--brand);letter-spacing:.04em;cursor:pointer;border:0;background:none;padding:0;display:flex;align-items:center}
.logo img{height:30px;width:auto}
.logo.a365{color:var(--navy)}
.sb{flex:1 1 auto;padding:14px 24px 6px;display:flex;flex-direction:column;gap:12px;min-height:0;overflow:hidden}
.sf{flex:0 0 32px;display:flex;align-items:center;gap:10px;padding:0 54px 0 24px;font-size:11px;color:var(--muted)}
.sf .seg{display:flex;gap:3px}.sf .seg i{display:block;width:22px;height:4px;background:var(--brand)}.sf .seg i:nth-child(2){width:12px}.sf .seg i:nth-child(3){width:6px}
.sf .rule{flex:1;height:1px;background:var(--line)}
.g{display:grid;gap:14px;min-width:0}
.gap-lg{gap:22px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-1-2{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}
.box{min-width:0}
.box h3{margin:0 0 6px;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.03em;text-transform:uppercase;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box h3 small{font-family:var(--f-body);text-transform:none;letter-spacing:0;font-weight:500;color:var(--muted);font-size:12px;margin-left:6px}
.cv{position:relative}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.kpi{border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:var(--soft)}
.kpi b{display:block;font-family:var(--f-display);font-size:26px;line-height:1;color:var(--ink)}
.kpi span{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.row-pec{display:grid;grid-template-columns:300px 50px minmax(0,1fr);gap:12px;align-items:center}
.arrow{height:30px;background:var(--line);clip-path:polygon(0 30%,60% 30%,60% 0,100% 50%,60% 100%,60% 70%,0 70%)}
.gname{text-align:center;font-family:var(--f-display);font-weight:600;letter-spacing:.04em;color:var(--navy);text-transform:uppercase;font-size:15px;margin-top:-4px}
.empty{font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:14px;text-align:center}
.note{font-size:13px;color:var(--ink-2);background:var(--soft);border-left:3px solid var(--navy);padding:10px 14px;border-radius:0 6px 6px 0}
.note.big{font-size:15px;line-height:1.5;align-self:start}
.note b{color:var(--ink)}
.note ul{margin:4px 0 6px;padding-left:18px}
.muted{color:var(--muted);font-size:12px}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--ink-2);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* tablas: sin desplazamiento, filas compactas */
table{border-collapse:collapse;width:100%;font-size:12px;border:1px solid var(--line)}
th{background:var(--brand);color:#fff;font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;padding:4px 5px;text-align:center;white-space:normal;line-height:1.2}
th.grp{background:var(--brand-dk)}
td{padding:3px 5px;border-top:1px solid var(--line);text-align:center;white-space:nowrap;height:25px}
td.l,th.l{text-align:left}
td.sm{font-size:11px}
td.wrap{white-space:normal;text-align:left;font-size:11px;line-height:1.3}
table.plan{table-layout:fixed}
table.plan th{white-space:normal}
table.plan td{vertical-align:top;padding:5px 6px}
tbody tr:nth-child(even) td{background:var(--soft)}
tr.tot td{font-weight:700;background:#E4E9F0!important}
td.p100{color:var(--ok);font-weight:600}
td.plow{color:var(--crit);font-weight:600}
td[contenteditable]{background:#FFFBEA!important;cursor:text;outline:none}
td[contenteditable]:focus{box-shadow:inset 0 0 0 2px var(--s1)}
td input{width:48px;border:1px solid var(--line);border-radius:4px;padding:1px 4px;text-align:right;background:#FFFBEA;font-size:12px}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:10px;font-weight:700;letter-spacing:.04em;color:#fff}
.st-EXCELENTE{background:var(--ok)}.st-BUENO{background:var(--good)}.st-REGULAR{background:var(--warn)}.st-SEGUIMIENTO{background:var(--crit)}
.var-up{color:var(--ok);font-weight:700}.var-dn{color:var(--crit);font-weight:700}
.meta{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:6px;overflow:hidden;text-align:center}
.meta div{padding:10px}.meta div+div{border-left:1px solid var(--line)}
.meta b{display:block;font-family:var(--f-display);font-size:34px;line-height:1.05}
.meta span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}

.pcards{display:grid;gap:10px}
.pcards.n5{grid-template-columns:repeat(5,minmax(0,1fr))}.pcards.n6{grid-template-columns:repeat(6,minmax(0,1fr))}
.pc{border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:grid;gap:5px;align-content:start}
.pc .t{font-size:12px;font-weight:600;color:var(--ink-2);min-height:31px;line-height:1.3}
.pc .v{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1}
.pc .v.low{color:var(--crit)}
.sbar{display:flex;height:10px;border-radius:3px;overflow:hidden;background:var(--track);gap:2px}
.sbar i{display:block;height:100%}
.sbar .c{background:var(--navy)}.sbar .n{background:var(--crit)}
.pc .m{font-size:10.5px;color:var(--muted)}

.slide.end .sb{align-items:center;justify-content:center}
.end .big{font-family:var(--f-display);font-weight:700;font-size:140px;color:var(--brand);letter-spacing:.08em}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:6px;font-size:13px;z-index:300}

/* ---- modo presentación ---- */
body.presenting{overflow:hidden}
body.presenting .bar,body.presenting .nav{visibility:hidden}
body.presenting .stage{display:none}
body.presenting .stage.cur{display:block;position:fixed;inset:0;width:auto;max-width:none;aspect-ratio:auto;z-index:200;background:#0E1116;box-shadow:none}
body.presenting .stage.cur .xp{display:none}
.pctl{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:210;display:flex;gap:6px;align-items:center;background:rgba(14,17,22,.82);color:#fff;border-radius:999px;padding:5px 8px;font-size:13px;opacity:.25;transition:opacity .2s}
.pctl:hover,.pctl:focus-within{opacity:1}
.pctl button{background:transparent;border:0;color:#fff;cursor:pointer;padding:5px 10px;border-radius:999px;font-weight:600}
.pctl button:hover{background:rgba(255,255,255,.14)}
.pctl span{min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
@media (max-width:700px){ .nav{display:none} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function parseDate(v){
  if(v==null||v==='') return null;
  if(v instanceof Date) return isNaN(v)?null:new Date(v.getFullYear(),v.getMonth(),v.getDate());
  if(typeof v==='number'){ if(v<20000||v>80000) return null; const d=new Date(Date.UTC(1899,11,30)+Math.floor(v)*864e5); return new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()); }
  const s=String(v).trim(); let m;
  if((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/))) return new Date(+m[3],+m[2]-1,+m[1]);
  if((m=s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return new Date(+m[1],+m[2]-1,+m[3]);
  return null;
}

function weeksOf(ym){
  const [y,m]=ym.split('-').map(Number);const off=(new Date(y,m-1,1).getDay()+6)%7;const last=new Date(y,m,0).getDate();
  const out=[];for(let n=1;;n++){const a=Math.max(1,7*(n-1)-off+1),b=Math.min(last,7*n-off);if(a>last)break;out.push({n,a,b,label:'Sem '+n,rango:String(a).padStart(2,'0')+'–'+String(b).padStart(2,'0')});}
  return out;
}

      ec=PECS.reduce((s,p)=>s+p.items.reduce((t,[c,w])=>t+(items[c]==='N'?0:w),0)/100*p.tope,0); }
    const sc={};PECS.forEach(p=>{const v=parseFloat(String(g(C.sc[p.k])??'').replace(',','.'));sc[p.k]=isNaN(v)?null:Math.max(0,Math.min(1,v/p.tope))});
    const ef=norm(g(C.efe)); const cz=norm(g(C.causa));
    out.push({
      id:g(C.id)||('r'+r), ase, usu:nameClean(g(C.usu)), camp, fm, fi, rd, ing:parseDate(g(C.ing)),
      gest, sc, tipo:nameClean(g(C.tipo)), prod:String(g(C.prod)??'').trim(),
      items, ec, efe: ef==='SI'?'SI':'NO',          // "NO APLICA" o vacío cuentan como no venta (venta + no venta = monitoreos)
      causa: cz.startsWith('AGENTE')?'AGENTE':cz.startsWith('CLIENTE')?'CLIENTE':cz.startsWith('PROCESO')?'PROCESO':null,
      cAg:String(g(C.cAg)??'').trim(), cCli:String(g(C.cCli)??'').trim(), cProc:String(g(C.cProc)??'').trim(),
      mot:String(g(C.mot)??'').trim(), obs:String(g(C.obs)??'').trim(), retro:/^SI/i.test(String(g(C.retro)??'').trim()),
      ana:String(g(C.ana)??'').trim(), tip:C.tip>=0?norm(g(C.tip)):null
    });
  }
  return cleanNames(out);
}
/* campaña agrupada cuando la base no trae la columna CAMPAÑA (export directo de Qualtrics) */
const CAMP_OUT={'VENTAS HOGAR':'HOGAR FIJO','MIGRACION':'MIGRACION','RENOVACION':'RENOVACION','PORTABILIDAD - LINEA NUEVA':'PORTABILIDAD'};
function campOf(gest,out,inb){
  if(norm(gest)==='INBOUND'||(!norm(out)&&norm(inb))) return 'PORTABILIDAD INB';
  const o=norm(out); return CAMP_OUT[o]||nameClean(out)||nameClean(inb)||'SIN CAMPAÑA';
}
/* unifica el nombre del asesor: quita prefijos, usa el nombre más frecuente de cada usuario y corrige nombres cortados */
function cleanNames(out){
  const isName=s=>/[A-ZÑ]{2,}\s+[A-ZÑ]{2,}/.test(norm(s));
  const byU=new Map();
  for(const r of out){
    r.ase=r.ase.replace(/^(OUT|INB)\s*-\s*MAG\s*-\s*/i,'').trim();
    if(!r.usu||!isName(r.ase)) continue;
    const m=byU.get(r.usu)||new Map(); m.set(r.ase,(m.get(r.ase)||0)+1); byU.set(r.usu,m);
  }
  const tot=new Map(); out.forEach(r=>tot.set(r.ase,(tot.get(r.ase)||0)+1));
  for(const r of out){const m=byU.get(r.usu); if(m) r.ase=[...m].sort((a,b)=>b[1]-a[1]||tot.get(b[0])-tot.get(a[0])||b[0].length-a[0].length)[0][0];}
  const names=[...new Set(out.map(r=>r.ase))];
  const full=new Map(names.map(n=>[n,names.find(x=>x!==n&&x.startsWith(n)&&x.length-n.length<=2)||n]));
  out.forEach(r=>r.ase=full.get(r.ase));
  return out.filter(r=>isName(r.ase));
}

/* PEC del monitoreo: el puntaje de la base; si no viene, la misma regla de Qualtrics (NO APLICA cuenta como cumplido) */
function pecRec(r,p){if(r.sc&&r.sc[p.k]!=null)return r.sc[p.k];let w=0,ok=0;for(const [c,wt] of p.items){const v=r.items[c];if(v==='C'||v==='A'){w+=wt;ok+=wt}else if(v==='N')w+=wt}return w?ok/w:null}
const pecAgg=(rs,k)=>mean(rs.map(r=>pecRec(r,PEC[k])));
function itemStats(rs,c){let C=0,N=0,A=0;for(const r of rs){const v=r.items[c];if(v==='C')C++;else if(v==='N')N++;else if(v==='A')A++}return {C,N,A,p:pct(C,C+N)}}
const efect=rs=>rs.length?rs.filter(r=>r.ec>=S.cfg.umbral).length/rs.length:null;
const ecAvg=rs=>{const m=mean(rs.map(r=>r.ec));return m==null?null:m/100};
function statusOf(v){if(v==null)return null;const x=v*100;return x>=S.cfg.exc?'EXCELENTE':x>=S.cfg.bue?'BUENO':x>=S.cfg.reg?'REGULAR':'SEGUIMIENTO'}
const pill=s=>s?`<span class="pill st-${s}">${s}</span>`:'—';
const tdp=v=>`<td class="${v==null?'':v>=0.995?'p100':v*100<S.cfg.reg?'plow':''}">${fmt(v)}</td>`;
function varTd(a,b){if(a==null||b==null)return '<td>—</td>';const d=Math.round((b-a)*100);return `<td class="${d>0?'var-up':d<0?'var-dn':''}">${d>0?'▲ +':d<0?'▼ ':''}${d} pp</td>`}
function groupBy(rs,f){const m=new Map();for(const r of rs){const k=f(r);if(k==null)continue;if(!m.has(k))m.set(k,[]);m.get(k).push(r)}return m}
function monthsBetween(a,b){if(!a)return null;return (b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth())-(b.getDate()<a.getDate()?1:0)}
const hasN=(r,k)=>PEC[k].items.some(([c])=>r.items[c]==='N');
const nCount=r=>PECS.reduce((s,p)=>s+p.items.filter(([c])=>r.items[c]==='N').length,0);
const lag=r=>r.fm&&r.fi?Math.round((r.fm-r.fi)/864e5):null;

function motivoCat(r){
  const t=norm([r.mot,r.cAg,r.cCli].join(' '));
  const ag=/REBAT|NECESIDAD|SONDEO|HABILIDAD|SONRISA|ACTITUD|NO OFRECE|NO INTERACTUA|DESANIMAD|GUIA COMERCIAL|NO CREA/;
  if(r.causa==='AGENTE'&&ag.test(t)) return 'Asesor no sondea / no rebate';
  const L=[[/SIN INTERACCI|NO HAY (MAYOR )?INTERACCI|NO CONTESTA|AUDIO|SE PIERDE COMUNICACI/,'Sin interacción / audio'],
    [/CORTA|CUELGA|CORTE/,'Cliente corta la llamada'],[/MALA EXPERIENCIA/,'Mala experiencia con Claro'],
    [/PREPAGO|RECARGA/,'Prefiere prepago / recargas'],[/COSTO|PRECIO|RECURSO|ECONOM|MAS BARAT|MENOR COSTO/,'Precio / recursos económicos'],
    [/ESPERA|DEMORA/,'Tiempo de espera'],[/AGEND|VOLVER A LLAMAR|OCUPAD/,'Agenda / cliente ocupado'],[/TITULAR/,'No es el titular'],
    [ag,'Asesor no sondea / no rebate'],[/NO (ESTA |SE ENCUENTRA )?INTERES|NO DESEA|NO QUIERE|CONFORME|YA (TIENE|CUENTA)|SATISFECH/,'No interesado / conforme'],
    [/CAMBIO DE NUMERO|PORTABILIDAD|LINEA/,'Solicitud distinta a la oferta']];
  for(const [re,l] of L) if(re.test(t)) return l;
  return t?'Otros':'Sin detalle';
}
function planKey(txt){
  const t=norm(txt); if(!t) return null;
  if(/NO APLICA|TERMINA|CORTA|CUELGA|CULMINA|SIN INTERACC|NO HUBO|NO LLEGA|NO SE DETECTA|NO INTERESAD|NO GENERA|NO HAY|AGEND|NO DESEA|YA TIENE|NO CONTESTA/.test(t)) return null;
  const eq=t.match(/IPHONE|XIAOMI|REDMI|HONOR|INFINIX|SAMSUNG|MOTOROLA|OPPO|HUAWEI|TECNO|ZTE/); if(eq) return 'Equipo '+eq[0].charAt(0)+eq[0].slice(1).toLowerCase();
  if(/RENOVACION DE EQUIPO/.test(t)) return 'Renovación de equipo';
  const pr=t.match(/\$\s?(\d+(?:[.,]\d+)?)|(\d+(?:[.,]\d+)?)\s?\$/); const price=pr?Math.floor(parseFloat((pr[1]||pr[2]).replace(',','.'))):null;
  const play=t.match(/(\d)\s?PLAY/);
  if(play) return play[1]+' Play'+(price?' $'+price:'');
  if(price) return 'Plan $'+price;
  return null;
}

  add(3,'Efectividad por parámetros PEC’s afectados '+ymLabel(mes),`<div class="g gap-lg">${pecRow('NEG')}${pecRow('ASE')}</div>`);

  /* ---- 4 ---- */
  const corte=new Date(+mes.slice(0,4),+mes.slice(5,7),0);
  const metaK=a=>'meta:'+mes+':'+a, altK=a=>'altas:'+mes+':'+a;
  const aseRows=[...groupBy(cur,r=>r.ase).entries()].map(([a,rs])=>{
    const ing=rs.find(r=>r.ing)?.ing||null, ant=monthsBetween(ing,corte), pr=prevR.filter(r=>r.ase===a);
    return {a,rs,ant,camp:[...new Set(rs.map(r=>r.camp))].join(', '),antiguo:ant==null||ant>=S.cfg.antig,
      ef:efect(rs),ec:ecAvg(rs),efPrev:efect(pr),sem:ws.map(w=>efect(rs.filter(r=>r.sem===w.n))),
      vSi:rs.filter(r=>r.efe==='SI').length,vAp:rs.filter(r=>r.efe!=='NA').length,neg:pecAgg(rs,'NEG'),cum:pecAgg(rs,'CUM'),
      negPrev:pecAgg(pr,'NEG'),cumPrev:pecAgg(pr,'CUM'),
      negS:ws.map(w=>pecAgg(rs.filter(r=>r.sem===w.n),'NEG')),cumS:ws.map(w=>pecAgg(rs.filter(r=>r.sem===w.n),'CUM')),
      meta:store.get(metaK(a),''),alt:store.get(altK(a),'')};
  }).sort((x,y)=>(y.ec??0)-(x.ec??0));
  let sMeta=0,sAlt=0; aseRows.forEach(x=>{if(x.meta!=='')sMeta+=+x.meta;if(x.alt!=='')sAlt+=+x.alt});
  const antG=aseRows.filter(x=>x.antiguo), nueG=aseRows.filter(x=>!x.antiguo);
  const t4=(rs,tit)=>rs.length?`<table><thead><tr><th class="l grp">${tit}</th><th>Campaña</th><th>Antig.</th><th>Monit.</th><th>${PV}</th>${wh}<th>${MES}</th><th>PEC final</th><th>Status calidad</th><th>Venta</th><th>Efect. venta</th><th>Meta</th><th>Altas</th><th>Cumpl.</th></tr></thead><tbody>`+
    rs.map(x=>{const cp=x.meta!==''&&x.alt!==''&&+x.meta?(+x.alt)/(+x.meta):null;
      return `<tr><td class="l">${esc(x.a)}</td><td class="sm">${esc(x.camp)}</td><td>${x.ant==null?'—':x.ant+' m'}</td><td>${x.rs.length}</td>${tdp(x.efPrev)}${x.sem.map(tdp).join('')}${tdp(x.ef)}${tdp(x.ec)}<td>${pill(statusOf(x.ec))}</td><td>${x.vSi}/${x.vAp}</td>${tdp(pct(x.vSi,x.vAp))}
      <td><input type="number" min="0" data-k="${esc(metaK(x.a))}" value="${esc(x.meta)}" aria-label="Meta ${esc(x.a)}"></td><td><input type="number" min="0" data-k="${esc(altK(x.a))}" value="${esc(x.alt)}" aria-label="Altas ${esc(x.a)}"></td>${tdp(cp)}</tr>`}).join('')+'</tbody></table>':emptyBox(tit+': sin asesores en este grupo.');
  add(4,'Efectividad de Monitoreo y cumplimiento de meta por asesor',`
    <div class="fit"><div class="fi">${t4(antG,'Asesores antiguos')}${t4(nueG,'Asesores nuevos')}</div></div>
    <div class="g g3" style="flex:0 0 auto">
      <div class="note">De acuerdo a los resultados de los <b>asesores antiguos (${antG.length})</b>:${statusDist(antG.map(x=>x.ec))}</div>
      <div class="note">De acuerdo a los resultados de los <b>asesores nuevos (${nueG.length})</b>:${statusDist(nueG.map(x=>x.ec))}</div>
      <div class="box" style="align-self:center"><div class="meta"><div><b class="num">${sMeta||'—'}</b><span>META</span></div><div><b class="num">${sAlt||'—'}</b><span>ALTAS</span></div><div><b class="num">${sMeta?fmt(sAlt/sMeta):'—'}</b><span>CUMPLIMIENTO</span></div></div><div class="legend" style="margin-top:4px">Meta y altas: ingrésalas por asesor en la tabla.</div></div>
    </div>`);

  /* ---- 5 ---- */
  const t5=(rs,tit)=>rs.length?`<table><thead><tr><th class="l grp" rowspan="2">${tit}</th><th rowspan="2">Antig.</th><th colspan="${ws.length+4}">PEC NEG</th><th colspan="${ws.length+4}">PEC CUMP</th></tr>
    <tr><th>${PV}</th>${wh}<th>${MES}</th><th>Var.</th><th>Status NEG</th><th>${PV}</th>${wh}<th>${MES}</th><th>Var.</th><th>Status CUMP</th></tr></thead><tbody>`+
    rs.map(x=>`<tr><td class="l">${esc(x.a)}</td><td>${x.ant==null?'—':x.ant+' m'}</td>${tdp(x.negPrev)}${x.negS.map(tdp).join('')}${tdp(x.neg)}${varTd(x.negPrev,x.neg)}<td>${pill(statusOf(x.neg))}</td>${tdp(x.cumPrev)}${x.cumS.map(tdp).join('')}${tdp(x.cum)}${varTd(x.cumPrev,x.cum)}<td>${pill(statusOf(x.cum))}</td></tr>`).join('')+'</tbody></table>':emptyBox(tit+': sin asesores en este grupo.');
  const sort5=a=>a.slice().sort((p,q)=>(q.neg??0)+(q.cum??0)-(p.neg??0)-(p.cum??0));
  add(5,'Efectividad de Monitoreo de PEC NEG – PEC CUMP',`
    <div class="fit"><div class="fi">${t5(sort5(antG),'Asesores antiguos')}${t5(sort5(nueG),'Asesores nuevos')}</div></div>
    <div class="g g2" style="flex:0 0 auto">
      <div class="note">En relación al <b>PEC NEG de los asesores antiguos</b>:${statusDist(antG.map(x=>x.neg))}Así mismo, en relación al <b>PEC CUMP</b>:${statusDist(antG.map(x=>x.cum))}</div>
      <div class="note">En relación al <b>PEC NEG de los asesores nuevos</b>:${statusDist(nueG.map(x=>x.neg))}Así mismo, en relación al <b>PEC CUMP</b>:${statusDist(nueG.map(x=>x.cum))}</div></div>`);

  /* ---- 6 ---- */
  const P=S.cfg.plazo;
  const r6=[...groupBy(cur,r=>r.ase).entries()].map(([a,rs])=>{const req=rs.filter(r=>nCount(r)>0),ret=rs.filter(r=>r.retro),den=ret.filter(r=>lag(r)!=null&&lag(r)<=P).length;
    return {a,n:rs.length,req:req.length,ret:ret.length,den,fue:ret.length-den,no:req.filter(r=>!r.retro).length,errs:rs.reduce((s,r)=>s+nCount(r),0)}}).sort((x,y)=>y.errs-x.errs||y.n-x.n);
  const T6=r6.reduce((t,x)=>{for(const k of ['n','req','ret','den','fue','no','errs'])t[k]+=x[k];return t},{n:0,req:0,ret:0,den:0,fue:0,no:0,errs:0});
  const b6=T6.den+T6.fue+T6.no;
  const worst=r6[0]; let worstTxt='No se registran incumplimientos en el periodo.';
  if(worst&&worst.errs){const wr=cur.filter(r=>r.ase===worst.a),fails=new Map();PECS.forEach(p=>p.items.forEach(([c,,l])=>{const k=wr.filter(r=>r.items[c]==='N').length;if(k)fails.set(l,k)}));
    worstTxt=`<b>${esc(worst.a)}</b> registra la mayor recurrencia de incumplimientos del periodo (${worst.errs} en ${worst.n} monitoreos), principalmente en: ${topList(fails,3).map(([l,k])=>`<b>${esc(l.toLowerCase())}</b> (${k})`).join(', ')}. Se recomienda seguimiento personalizado y nueva medición la siguiente semana.`}
  add(6,'Efectividad de Retroalimentaciones',`
    <div class="fit"><div class="fi"><table><thead><tr><th class="l grp">Asesores</th><th>Total de monitoreos</th><th>Incumplim.</th><th>Con error</th><th>Retro aplicada</th><th>% retro</th><th>Dentro de plazo</th><th>Fuera de plazo</th><th>No realizadas</th></tr></thead><tbody>
    ${r6.map(x=>`<tr><td class="l">${esc(x.a)}</td><td>${x.n}</td><td>${x.errs}</td><td>${x.req}</td><td>${x.ret}</td>${tdp(pct(x.ret,x.n))}<td>${x.den}</td><td>${x.fue}</td><td>${x.no}</td></tr>`).join('')}
    <tr class="tot"><td class="l">Total general</td><td>${T6.n}</td><td>${T6.errs}</td><td>${T6.req}</td><td>${T6.ret}</td><td>${fmt(pct(T6.ret,T6.n))}</td><td>${T6.den}</td><td>${T6.fue}</td><td>${T6.no}</td></tr></tbody></table></div></div>
    <div class="g g2" style="flex:0 0 250px">
      <div class="box"><h3>Efectividad Retroalimentación</h3>${canvas(220,id=>bar(id,['Realizadas dentro de tiempo','Realizadas fuera de tiempo','No realizadas'],[{data:[pct(T6.den,b6),pct(T6.fue,b6),pct(T6.no,b6)],backgroundColor:css('--s1')}],{thick:70}))}</div>
      <div class="note big">${worstTxt}<br><span class="muted">Dentro de plazo: retro aplicada con ≤ ${P} día(s) entre la llamada y el monitoreo. No realizadas: monitoreos con al menos un “NO CUMPLE” sin retro aplicada.</span></div></div>`);

  /* ---- 7 ---- */
  const CZ=['CLIENTE','AGENTE','PROCESO'];
  const czDist=rs=>{const v=rs.filter(r=>r.causa);return CZ.map(c=>pct(v.filter(r=>r.causa===c).length,v.length))};
  const czCur=cur.filter(r=>r.causa);
  const motTable=c=>{const rs=czCur.filter(r=>r.causa===c);if(!rs.length)return emptyBox('Sin casos de causa '+c.toLowerCase()+'.');
    return `<table><thead><tr><th class="l">Causa raíz / ${c.toLowerCase()}</th><th>Cant.</th><th>%</th></tr></thead><tbody>${topList(countBy(rs,motivoCat),8).map(([k,v])=>`<tr><td class="l">${esc(k)}</td><td>${v}</td><td>${fmt(v/rs.length)}</td></tr>`).join('')}<tr class="tot"><td class="l">Total general</td><td>${rs.length}</td><td>100%</td></tr></tbody></table>`};
  const ag=[...groupBy(czCur.filter(r=>r.causa==='AGENTE'),r=>r.ase).entries()].sort((a,b)=>b[1].length-a[1].length);
  const agTable=ag.length?`<table><thead><tr><th class="l">Asesores / causa raíz agente</th><th>Cant.</th>${wh}<th>%</th><th class="l">Motivo principal</th></tr></thead><tbody>
    ${ag.map(([a,rs])=>{const all=cur.filter(r=>r.ase===a).length,mm=topList(countBy(rs,motivoCat),1)[0];return `<tr><td class="l">${esc(a)}</td><td>${rs.length}</td>${wCnt(rs)}<td>${fmt(rs.length/all)}</td><td class="l">${esc(mm?mm[0]:'')}</td></tr>`}).join('')}</tbody></table>`:emptyBox('Sin casos atribuibles al agente.');
  add(7,'Análisis de No Aceptación – Causa Raíz',`
    <div class="g g3">
      <div class="box"><h3>Causa raíz mensual – Últimos ${meses.length} meses</h3>${canvas(220,id=>bar(id,CZ,meses.map((m,i)=>({label:ymShort(m),data:czDist(F.filter(r=>r.ym===m)),backgroundColor:MONTHCOL(meses.length)[i]})),{thick:30}))}</div>
      <div class="box"><h3>Causa raíz – ${ymLabel(mes)} <small>${czCur.length} casos</small></h3>${canvas(220,id=>bar(id,CZ,[{data:czDist(cur),backgroundColor:[css('--s1'),css('--s2'),css('--s3')]}],{thick:56}))}</div>
      <div class="box"><h3>Causa raíz por semana</h3>${canvas(220,id=>bar(id,CZ,ws.map((w,i)=>({label:w.label,data:czDist(bySem(w.n)),backgroundColor:SER()[i%5]})),{thick:20}))}</div>
    </div>
    <div class="g gfill" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.5fr)"><div class="fit"><div class="fi">${motTable('CLIENTE')}</div></div><div class="fit"><div class="fi">${motTable('AGENTE')}</div></div><div class="fit"><div class="fi">${agTable}</div></div></div>`);

  /* ---- 8 ---- */
  const conPlan=rs=>rs.filter(r=>planKey(r.prod));
  const pcur=conPlan(cur), topP=topList(countBy(pcur,r=>planKey(r.prod)),6).map(x=>x[0]), top4=topP.slice(0,4);
  const share=(rs,p)=>{const c=conPlan(rs);return c.length?c.filter(r=>planKey(r.prod)===p).length/c.length:null};
  const OFC=['Cumplimiento de proc_1','Cumplimiento de proc_2','Cumplimiento de proc_4'];
  const ofrecen=[...groupBy(cur.filter(r=>OFC.some(c=>r.items[c]==='N')),r=>r.ase).entries()].sort((a,b)=>b[1].length-a[1].length);
  const ofTable=rows=>`<table><thead><tr><th class="l">Asesores que no ofrecen de manera correcta</th><th>Monit.</th>${wh}<th class="l">Parámetro principal</th></tr></thead><tbody>
    ${rows.map(([a,rs])=>{const m=new Map();rs.forEach(r=>OFC.forEach(c=>{if(r.items[c]==='N'){const l=PEC.NEG.items.find(i=>i[0]===c)[2];m.set(l,(m.get(l)||0)+1)}}));const t=topList(m,1)[0];
      return `<tr><td class="l">${esc(a)}</td><td>${rs.length}</td>${wCnt(rs)}<td class="l">${esc(t?t[0]+' ('+t[1]+')':'')}</td></tr>`}).join('')}</tbody></table>`;
  add(8,'Planes más ofertados '+ymLabel(mes),`
    <div class="g g3">
      <div class="box"><h3>Análisis comercial – Planes más ofertados</h3>${canvas(220,id=>bar(id,topP,[{data:topP.map(p=>share(cur,p)),backgroundColor:css('--s1')}],{thick:40}))}</div>
      <div class="box"><h3>Comparativa Mensual</h3>${canvas(220,id=>bar(id,top4,meses.map((m,i)=>({label:ymShort(m),data:top4.map(p=>share(F.filter(r=>r.ym===m),p)),backgroundColor:MONTHCOL(meses.length)[i]})),{thick:30}))}</div>
      <div class="box"><h3>Comparativa – Ofrecimiento semanal</h3>${canvas(220,id=>bar(id,top4,ws.map((w,i)=>({label:w.label,data:top4.map(p=>share(bySem(w.n),p)),backgroundColor:SER()[i%5]})),{thick:18}))}</div>
    </div>
    <div class="g g2 gfill">
      <div class="fit"><div class="fi">${topP.length?`<table><thead><tr><th class="l">Producto ofertado</th><th>Cant.</th>${wh}<th>%</th></tr></thead><tbody>${topP.map(p=>{const rs=pcur.filter(r=>planKey(r.prod)===p);return `<tr><td class="l">${esc(p)}</td><td>${rs.length}</td>${wCnt(rs)}<td>${fmt(rs.length/pcur.length)}</td></tr>`}).join('')}</tbody></table>`:emptyBox('No se identificaron productos ofertados.')}</div></div>
      <div class="fit"><div class="fi">${ofrecen.length?ofTable(ofrecen):emptyBox('Sin incumplimientos de ofrecimiento.')}</div></div>
    </div>`);

  /* ---- 9 y 10 ---- */
  const pecDetail=(k,sec,title)=>{
    const p=PEC[k];
    const cards=`<div class="pcards n${p.items.length}">${p.items.map(([c,,l])=>{const s=itemStats(cur,c),n=s.C+s.N;return `<div class="pc"><div class="t">${esc(l)}</div><div class="v ${s.p!=null&&s.p*100<S.cfg.reg?'low':''}">${fmt(s.p)}</div>
      <div class="sbar" role="img" aria-label="Cumple ${fmt(s.p)}">${n?`<i class="c" style="width:${s.C/n*100}%"></i><i class="n" style="width:${s.N/n*100}%"></i>`:''}</div><div class="m">${s.C} cumple · ${s.N} no cumple · ${s.A} no aplica</div></div>`}).join('')}</div>
      <div class="legend"><span><i style="background:var(--ppt-red)"></i>Cumple</span><span><i style="background:var(--ppt-navy)"></i>No cumple</span></div>`;
    const g=[...groupBy(cur.filter(r=>hasN(r,k)),r=>r.ase).entries()].sort((a,b)=>b[1].length-a[1].length);
    const tbl=rows=>`<table><thead><tr><th class="l">Asesores que no cumplen</th><th>Cant.</th>${wh}<th>% de sus monit.</th><th class="l">Parámetro afectado</th></tr></thead><tbody>${rows.map(([a,x])=>{const all=cur.filter(r=>r.ase===a).length,m=new Map();
      x.forEach(r=>p.items.forEach(([c,,l])=>{if(r.items[c]==='N')m.set(l,(m.get(l)||0)+1)}));
      return `<tr><td class="l">${esc(a)}</td><td>${x.length}</td>${wCnt(x)}<td>${fmt(x.length/all)}</td><td class="l sm">${topList(m,2).map(([l,v])=>esc(l)+' ('+v+')').join('; ')}</td></tr>`}).join('')}</tbody></table>`;
    add(sec,title+' '+ymLabel(mes),`${cards}<div class="fit"><div class="fi">${g.length?tbl(g):emptyBox('Ningún asesor incumple '+p.nombre+' en el periodo.')}</div></div>`);
  };
  pecDetail('CUM',9,'PEC Cumplimiento'); pecDetail('NEG',10,'PEC Negociación');

  /* ---- 11 ---- */
  const hasTip=cur.some(r=>r.tip);
  const vRate=rs=>{const v=rs.filter(r=>r.efe!=='NA');return pct(v.filter(r=>r.efe==='SI').length,v.length)};
  const nv=cur.filter(r=>r.efe==='NO'), nvm=countBy(nv,motivoCat);
  const nvA=[...groupBy(nv,r=>r.ase).entries()].sort((a,b)=>b[1].length-a[1].length);
  add(11,'Análisis de Tipificación',`
    <div class="g g3">
      <div class="box"><h3>Efectivización ${ymLabel(mes)}</h3>${canvas(200,id=>bar(id,['Venta','No venta'],[{data:[cur.filter(r=>r.efe==='SI').length,nv.length],backgroundColor:[css('--s1'),css('--s2')]}],{count:true,thick:56}))}</div>
      <div class="box"><h3>% venta semanal <small>sobre el total de monitoreos</small></h3>${canvas(200,id=>bar(id,ws.map(w=>w.label),[{data:ws.map(w=>vRate(bySem(w.n))),backgroundColor:css('--s1')}],{thick:56}))}</div>
      <div class="box"><h3>% venta últimos ${meses.length} meses</h3>${canvas(200,id=>bar(id,meses.map(ymShort),[{data:meses.map(m=>vRate(F.filter(r=>r.ym===m))),backgroundColor:css('--s1')}],{thick:56}))}</div>
    </div>
    <div class="g g-1-2 gfill">
      <div class="fit"><div class="fi">${nv.length?`<table><thead><tr><th class="l">Motivo de no venta</th><th>Cant.</th><th>%</th></tr></thead><tbody>${topList(nvm,10).map(([k,v])=>`<tr><td class="l">${esc(k)}</td><td>${v}</td><td>${fmt(v/nv.length)}</td></tr>`).join('')}<tr class="tot"><td class="l">Total general</td><td>${nv.length}</td><td>100%</td></tr></tbody></table>`:emptyBox('Sin no ventas en el periodo.')}</div></div>
      <div class="fit"><div class="fi">${nvA.length?`<table><thead><tr><th class="l">Asesores con más no ventas</th><th>No venta</th>${wh}<th class="l">Motivo principal</th></tr></thead><tbody>
        ${nvA.map(([a,rs])=>`<tr><td class="l">${esc(a)}</td><td>${rs.length}</td>${wCnt(rs)}<td class="l">${esc(topList(countBy(rs,motivoCat),1)[0][0])}</td></tr>`).join('')}</tbody></table>`:''}</div></div>
    </div>
    ${hasTip?'':'<div class="legend">La base no trae columna de tipificación; se usa “Efectivización” y el motivo de no venta.</div>'}`);

  /* ---- 12, 13, 14: una lámina cada uno, con los casos principales ---- */
  const hoy=new Date(), hoyTxt=String(hoy.getDate()).padStart(2,'0')+'/'+String(hoy.getMonth()+1).padStart(2,'0')+'/'+hoy.getFullYear();
  const ed=(key,def,cls='')=>{const v=store.get('pa:'+key,null);return `<td contenteditable="true" class="${cls}" data-pa="${esc(key)}">${esc(v??def)}</td>`};
  const negRows=[];for(const [c,,l] of PEC.NEG.items){for(const [a,rs] of groupBy(cur.filter(r=>r.items[c]==='N'),r=>r.ase))negRows.push({a,c,l,rs})}
  negRows.sort((x,y)=>y.rs.length-x.rs.length);
  const ex=r=>trunc(r.mot&&r.mot.length>25?r.mot:r.obs,170);
  const more=(tot,shown,what)=>tot>shown?` Se muestran los ${shown} ${what} con más casos de ${tot}.`:'';
  const editNote=t=>`<div class="legend">Celdas en amarillo editables; se guardan en este navegador y salen así en el PPT.${t}</div>`;
  const PA_N={12:6,13:6,14:8};
  const n12=negRows.slice(0,PA_N[12]);
  add(12,'PLAN DE ACCIÓN PEC Negociación',n12.length?`<div class="fit"><div class="fi"><table class="plan"><colgroup><col style="width:86px"><col style="width:86px"><col style="width:150px"><col style="width:170px"><col style="width:46px"><col><col style="width:140px"><col style="width:250px"><col style="width:110px"></colgroup>
    <thead><tr><th>Fecha de solicitud</th><th>Fecha de refuerzo</th><th class="l">Sub parámetro (PEC NEG)</th><th class="l">Asesores que incumplieron</th><th>Casos</th><th class="l">Escenario</th><th class="l">Plan que debió ofertar</th><th class="l">Recomendación</th><th>Responsable</th></tr></thead><tbody>
    ${n12.map(x=>{const k=mes+'|neg|'+x.a+'|'+x.c;return `<tr>${ed(k+'|fs',hoyTxt)}${ed(k+'|fr','PENDIENTE')}<td class="wrap">${esc(x.l)}</td><td class="wrap">${esc(x.a)}</td><td>${x.rs.length}</td><td class="wrap">${esc(ex(x.rs[0]))}</td><td class="wrap">${esc(trunc(x.rs[0].prod,60))}</td>${ed(k+'|rec',RECO[x.c]||'Reforzar el parámetro con el asesor.','wrap')}${ed(k+'|resp','CALIDAD / CAPACITACIÓN','wrap')}</tr>`}).join('')}
    </tbody></table></div></div>${editNote(more(negRows.length,n12.length,'incumplimientos'))}`:emptyBox('Sin incumplimientos de PEC Negociación en el periodo.'));

  const accAg={'Asesor no sondea / no rebate':'Realizar un mayor sondeo de necesidades y ofrecimiento escalonado; rebatir con beneficios del plan y promociones vigentes antes de cerrar.','Cliente corta la llamada':'Captar el interés en los primeros segundos con el gancho comercial y confirmar disponibilidad del cliente.','Tiempo de espera':'Tener abiertos los materiales de apoyo desde el inicio para evitar esperas.'};
  const n13=ag.slice(0,PA_N[13]);

/* ================= escala 16:9 y modo presentación ================= */
/* reduce tablas/notas para que quepan en su lámina (sin paginar) */
function fitAll(){
  document.querySelectorAll('.fit').forEach(f=>{const i=f.firstElementChild;if(!i)return;
    const set=k=>{i.style.transform=k<1?`scale(${k})`:'';i.style.width=k<1?(100/k)+'%':''};
    set(1); const H=f.clientHeight, W=f.clientWidth, h0=i.scrollHeight, w0=i.scrollWidth;
    if(!H||(h0<=H+1&&w0<=W+1)) return;
    const fits=k=>i.scrollHeight*k<=H+1&&i.scrollWidth<=i.clientWidth+1;
    let k=Math.min(H/h0,W/w0); set(k);          // al ensanchar, la tabla queda más baja
    for(let t=0;t<6&&!fits(k);t++){k*=0.94;set(k)}
    const k2=Math.min(1,H/i.scrollHeight); if(k2>k){set(k2); if(!fits(k2)) set(k)}
  });
}

const PRES={on:false,i:0};
const stages=()=>[...document.querySelectorAll('.stage')];
function scaleAll(){ if(PRES.on) return; for(const st of stages()){const k=st.clientWidth/1280;st.querySelector('.slide').style.transform=`scale(${k})`} }
function fitPresenter(){
  const st=stages()[PRES.i]; if(!st) return;
  const W=window.innerWidth,H=window.innerHeight,k=Math.min(W/1280,H/720);
  st.querySelector('.slide').style.transform=`translate(${(W-1280*k)/2}px,${(H-720*k)/2}px) scale(${k})`;
  $('#pCount').textContent=`${PRES.i+1} / ${stages().length}`;
}
function showSlide(i){const ss=stages();PRES.i=Math.max(0,Math.min(ss.length-1,i));ss.forEach((s,j)=>s.classList.toggle('cur',j===PRES.i));fitPresenter()}
function present(i){
  PRES.on=true; document.body.classList.add('presenting'); $('#pctl').hidden=false; showSlide(i);
  try{const r=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen({navigationUI:'hide'});if(r&&r.catch)r.catch(()=>{})}catch(e){}
}
function exitPresent(){
  if(!PRES.on) return;

  stages().forEach(s=>s.classList.remove('cur'));
  try{if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{})}catch(e){}

}
function visibleIndex(){const ss=stages();let best=0,bd=Infinity;ss.forEach((s,i)=>{const r=s.getBoundingClientRect();const d=Math.abs(r.top+r.height/2-window.innerHeight/2);if(d<bd){bd=d;best=i}});return best}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&PRES.on)exitPresent();else if(PRES.on)fitPresenter()});
window.addEventListener('resize',()=>{PRES.on?fitPresenter():scaleAll()});
try{new ResizeObserver(()=>scaleAll()).observe(document.getElementById('deck'))}catch(e){}
document.addEventListener('keydown',e=>{
  if(!PRES.on) return; if(e.target.closest&&e.target.closest('input,[contenteditable="true"],select')) return;
  if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();showSlide(PRES.i+1)}
  else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();showSlide(PRES.i-1)}
  else if(e.key==='Home'){showSlide(0)} else if(e.key==='End'){showSlide(stages().length-1)}
  else if(e.key==='Escape'){exitPresent()}
});
document.addEventListener('click',e=>{const b=e.target.closest('.xp');if(b)present(+b.dataset.p)});
$('#btnPresent').addEventListener('click',()=>present(visibleIndex()));
$('#pPrev').addEventListener('click',()=>showSlide(PRES.i-1));

    /* ---- 6. Retroalimentaciones (una lámina) ---- */

    const r6=[...groupBy(cur,r=>r.ase).entries()].map(([a,rs])=>{const req=rs.filter(r=>nCount(r)>0),ret=rs.filter(r=>r.retro),den=ret.filter(r=>lag(r)!=null&&lag(r)<=P).length;

      ag.slice(0,6).map(([a,rs])=>{const cat=topList(countBy(rs,motivoCat),1)[0][0],k=mes+'|ag|'+a;return [cell(a),cell(rs.length),cell(cat+(rs[0].mot?' – '+trunc(rs[0].mot,90):'')),cell(pa(k+'|cor',trunc(rs[0].obs,260))),cell(pa(k+'|acc',accAg[cat]||'Reforzar habilidades comerciales: sondeo, manejo de objeciones y cierre.'))]}),
      [1.6,0.6,2.2,4.33,4.2],'Sin casos de causa raíz agente en el periodo.');
    paSlide('Análisis de tipificación – Plan de acción',['FECHA DE SOLICITUD','FECHA DE REFUERZO','ASESORES QUE INCUMPLEN','NO VENTAS','ESCENARIOS','ACCIÓN','RESPONSABLE'],
      nvA.slice(0,8).map(([a,rs])=>{const k=mes+'|nv|'+a;return [cell(pa(k+'|fs',hoyTxt)),cell(pa(k+'|fr','PENDIENTE')),cell(a),cell(rs.length),cell(topList(countBy(rs,motivoCat),3).map(([c,v])=>`${c} (${v})`).join('; ')),cell(pa(k+'|acc','Revisar las llamadas con el asesor y reforzar rebate y cierre según el escenario.')),cell(pa(k+'|resp','CALIDAD / CAPACITACIÓN'))]}),
      [1.3,1.2,2.4,0.9,3.0,2.8,1.33],'Sin no ventas en el periodo.');

    /* ---- 15. Gracias ---- */
    s=pptx.addSlide(); s.background={color:'FFFFFF'};
    s.addText('GRACIAS',{x:0,y:2.6,w:13.33,h:1.6,align:'center',valign:'middle',fontFace:FONT,fontSize:72,bold:true,color:C.brand,charSpacing:6,isTextBox:true});
    footer(s);

    const fname=`Informe_Calidad_Ventas_${ymLabel(mes).replace(' ','_')}.pptx`;
    window.__lastPptx=pptx;
    if(window.claude&&window.claude.use){
      if(!DL_READY){toast('Preparando la descarga, intenta de nuevo en unos segundos.');return}
      if(!DL){toast('La descarga no está disponible en esta vista.');return}
      const buf=await pptx.write({outputType:'arraybuffer'});
      try{await DL.save({filename:fname,data:buf});toast('PowerPoint descargado: '+fname)}
      catch(e){toast(e&&e.code==='declined'?'Descarga cancelada.':e&&e.code==='rate_limited'?'Ya hay una descarga pendiente; confírmala o espera un momento.':'No se pudo descargar ('+(e&&(e.message||e.code)||'error')+').')}
    } else {
      await pptx.writeFile({fileName:fname}); toast('PowerPoint descargado: '+fname);
    }
  }catch(err){console.error(err);toast('No se pudo generar el PowerPoint: '+(err.message||err))}
  finally{btn.disabled=false;btn.textContent=old}
}
$('#btnPpt').addEventListener('click',exportPptx);
</script>
